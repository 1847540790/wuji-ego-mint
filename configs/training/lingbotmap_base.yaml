model:
  name: split_fov_head
  pretrained: assets/models/lingbot-map.pt
  pretrained_exclude: ["camera_head*"]
  enable_hand: true
  hand_head:
    name: refine
    dim: 512
    num_queries: 4
    num_iterations: 2
    trunk_depth: 1
    rotation_refine_mode: compose_axis_angle
    rotation_delta_frame: local
    rotation_delta_max_angle_deg: 30.0
    translation_delta_max_norm_m: 0.30
  enable_hand_presence: true
  hand_presence_head:
    dim: 256
    num_heads: 4
  fov_head:
    dim: 512
    num_heads: 8
    trunk_depth: 2
    initial_fov_deg: [60.0, 75.0]
    min_fov_rad: 1.0e-4
  backbone:
    img_size: 518
    patch_size: 14
    embed_dim: 1024
    use_sdpa: true
    use_gradient_checkpoint: true
    camera_num_iterations: 4
    enable_camera: true
    enable_depth: false
    enable_point: false
    enable_local_point: false

data:
  name: lerobot_v3
  # Replace this portable path with a LeRobot v3 dataset produced by `python -m mint pipeline`.
  root: data/processed/lerobot_v3
  camera_translation_normalization:
    enabled: true
    cache_dir: .cache/camera_normalization
    workers: 8
    files_per_task: 8
    window_batch_size: 4096
  clip_len: 32
  clip_stride: 32
  size_hw: [378, 518]
  batch_size: 1
  num_workers: 4
  shuffle: true

loss:
  hand_presence:
    weight: 1.0
  camera:
    weight: 2.0
    terms:
      - {name: trans_l1, weight: 1.0}
      - {name: rot_geo, weight: 1.0}
      - {name: fov_l1, weight: 1.0}
      - {name: trans_vel_l1, weight: 0.5}
      - {name: rot_vel_geo, weight: 0.5}
  mano_param:
    weight: 1.0
    terms:
      - {name: transl_l1, weight: 2.0}
      - {name: orient_geo, weight: 1.0}
      - {name: pose_geo, weight: 1.0}
      - {name: betas_l1, weight: 0.3}
  camera_mano_consistency:
    weight: 1.0
    terms:
      - {name: world_trans_vel_l1, weight: 1.0}
      - {name: world_orient_vel_geo, weight: 1.0}
      - {name: world_trans_l1, weight: 0.5}
      - {name: world_orient_geo, weight: 0.5}

train:
  run_name: mint-baseline
  output_dir: output/model_train
  reproducibility:
    enabled: true
    seed: 42
    deterministic_algorithms: false
  epochs: 1
  log_every: 10
  ckpt_every: 500
  grad_clip: 1.0
  grad_accum: 2
  mixed_precision: bf16
  wandb:
    enabled: false
    project: mint
    name: null
    mode: offline

optim:
  lr: 1.0e-4
  param_groups:
    - {match: "backbone.camera_head", lr: 1.0e-4}
    - {match: "backbone", lr: 5.0e-5}
    - {match: "hand_head", lr: 5.0e-4}
    - {match: "hand_presence_head", lr: 5.0e-4}
  weight_decay: 0.05
  warmup_steps: 2000

dist:
  nnodes: 1
  gpus_per_node: null
  master_addr: "127.0.0.1"
  master_port: 29500
